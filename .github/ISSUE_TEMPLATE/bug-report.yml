name: Bug report
description: Something in the app does not work as expected
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: Link to the page
      description: The full URL including the part after #
      placeholder: https://ariadne.surajvijayan.dev/#overview-in
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Screen
      options: [Laptop or desktop, Tablet, Phone]
